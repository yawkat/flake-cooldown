name: Check

on:
  push:
  # Pushes made with GITHUB_TOKEN (e.g. by update-flake.yml) don't trigger
  # workflows, so update-flake.yml starts this explicitly for its branch.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: python3 -m py_compile cooldown_update.py
      - run: nix flake check -L
