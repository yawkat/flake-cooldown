name: Check

on:
  push:
    branches: [ main ]
  # The runs of PRs opened by update-flake.yml (with GITHUB_TOKEN) wait for
  # approval: "Approve and run" on the PR starts them.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - run: python3 -m py_compile cooldown_update.py
      - run: nix flake check -L
