name: Check

on:
  push:
    branches: [ main ]
  # The runs of PRs opened by update-flake.yml (with GITHUB_TOKEN) wait for
  # approval: "Approve and run" on the PR starts them.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32
      - run: python3 -m py_compile cooldown_update.py
      - run: nix flake check -L
