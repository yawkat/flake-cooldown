name: Update flake

on:
  workflow_dispatch:
    inputs:
      cooldown_days:
        description: >-
          Only take third-party commits at least this many days old
          (0 for an urgent update). Inputs under yawkat/ and nixpkgs are exempt.
        type: number
        default: 5
  schedule:
    # Off the full hour: GitHub delays or drops scheduled runs under load,
    # and the top of the hour is the busiest.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      # This repository's own action, at the checked-out commit.
      - uses: ./
        id: update
        with:
          cooldown-days: ${{ inputs.cooldown_days }}
          # Stable channel: security backports should not wait out the cooldown.
          exempt-inputs: nixpkgs
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: update_flake_lock_action
          delete-branch: true
          title: flake update
          body: ${{ steps.update.outputs.body }}
